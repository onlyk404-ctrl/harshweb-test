<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#F0E5C4" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#F0E5C4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F0E5C4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>

  <!-- portrait silhouette -->
  <g opacity="0.6" fill="#F0E5C4" fill-opacity="0.06">
    <circle cx="600" cy="560" r="196"/>
    <path d="M600 790c-232 0-420 168-420 375v335h840v-335c0-207-188-375-420-375z"/>
  </g>

  <!-- square glyph (brand mark) -->
  <rect x="568" y="1130" width="64" height="64" rx="6" fill="#F0E5C4" fill-opacity="0.9"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="600" y="1276" fill="#F0E5C4" fill-opacity="0.92" font-size="30" letter-spacing="6">YOUR PHOTO GOES HERE</text>
    <text x="600" y="1322" fill="#F0E5C4" fill-opacity="0.5" font-size="22" letter-spacing="3">save it as  assets/img/harsh.jpg</text>
  </g>
</svg>
